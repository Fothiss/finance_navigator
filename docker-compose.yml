services:
  backend:
    build: ./backend
    environment:
      FN_MONEY_P_BORROW_NOW: ${FN_MONEY_P_BORROW_NOW:-0.65}
      FN_MONEY_P_WAIT: ${FN_MONEY_P_WAIT:-0.45}
      FN_MONEY_DEFAULT_PRESET: ${FN_MONEY_DEFAULT_PRESET:-balanced}
      FN_MONEY_Z_THRESHOLD: ${FN_MONEY_Z_THRESHOLD:-1.0}
      FN_MONEY_MIN_OBSERVATIONS: ${FN_MONEY_MIN_OBSERVATIONS:-30}
      FN_MONEY_CACHE_TTL_SECONDS: ${FN_MONEY_CACHE_TTL_SECONDS:-86400}
      FN_HTTP_RETRIES: ${FN_HTTP_RETRIES:-2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.cache:/app/.cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
